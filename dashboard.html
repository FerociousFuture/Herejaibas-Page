<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Herejaibas</title>
    <link rel="icon" type="image/png" href="jaiba.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f1115; color: #fff; font-family: 'Exo 2', sans-serif; padding: 40px 20px; }
        .container { max-width: 900px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #3a3f4b; padding-bottom: 20px; }
        .title { font-family: 'Oswald', sans-serif; font-size: 2rem; color: #f5a623; letter-spacing: 1px; text-transform: uppercase; }
        .btn-back { background: #23262f; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; border: 1px solid #3a3f4b; transition: 0.2s; }
        .btn-back:hover { background: #3a3f4b; }

        .card { background: #1a1c23; border: 1px solid #3a3f4b; padding: 30px; border-radius: 12px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #888; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; }
        input, textarea { width: 100%; background: #23262f; border: 1px solid #3a3f4b; border-radius: 8px; padding: 15px; color: #fff; font-size: 1rem; font-family: 'Exo 2', sans-serif; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: #f5a623; }
        textarea { resize: vertical; min-height: 100px; }
        
        .btn-submit { background: #27ae60; color: #fff; border: none; padding: 15px 30px; border-radius: 8px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.2s; letter-spacing: 1px; width: 100%; }
        .btn-submit:hover { background: #2ecc71; transform: translateY(-2px); }
        .btn-submit:disabled { background: #555; cursor: not-allowed; transform: none; }

        .subtitle { font-family: 'Oswald', sans-serif; font-size: 1.5rem; margin-bottom: 20px; color: #fff; text-transform: uppercase; }
        .slide-item { background: #1a1c23; border: 1px solid #3a3f4b; border-radius: 8px; padding: 20px; margin-bottom: 15px; display: flex; gap: 20px; align-items: center; }
        .slide-img { width: 150px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #333; }
        .slide-info { flex: 1; }
        .slide-badge { background: #f5a623; color: #000; padding: 3px 8px; border-radius: 3px; font-size: 0.7rem; font-weight: 900; margin-bottom: 5px; display: inline-block; }
        .slide-title { font-family: 'Oswald', sans-serif; font-size: 1.2rem; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .btn-delete { background: none; border: none; color: #e24a4a; font-size: 1.5rem; cursor: pointer; padding: 10px; transition: 0.2s; }
        .btn-delete:hover { color: #ff1c1c; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="title"><i class="fas fa-cogs"></i> Dashboard Novedades</h1>
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> VOLVER AL INICIO</a>
        </div>

        <div class="card">
            <h2 class="subtitle">AGREGAR NUEVO EVENTO AL CARRUSEL</h2>
            <div class="form-group">
                <label>Etiqueta / Badge (Ej: PRÓXIMO TORNEO)</label>
                <input type="text" id="ev-badge" placeholder="Texto corto resaltado...">
            </div>
            <div class="form-group">
                <label>Título Principal</label>
                <input type="text" id="ev-title" placeholder="TORNEO DE INVIERNO 40K...">
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea id="ev-desc" placeholder="Detalles del evento..."></textarea>
            </div>
            <div class="form-group">
                <label>URL de la Imagen (Fondo)</label>
                <input type="text" id="ev-img" placeholder="https://ejemplo.com/imagen.jpg">
            </div>
            <div class="form-group">
                <label>Link de Destino (Opcional - ¿A dónde lleva al hacer clic?)</label>
                <input type="text" id="ev-link" placeholder="https://facebook.com/grupo... o archivo.pdf">
            </div>
            <button class="btn-submit" id="btn-save" onclick="guardarEvento()"><i class="fas fa-save"></i> PUBLICAR EVENTO</button>
        </div>

        <h2 class="subtitle">EVENTOS ACTIVOS</h2>
        <div id="eventos-list">
            <p style="color: #888; font-style: italic;">Cargando eventos...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        const sb = supabase.createClient(window._sbUrl, window._sbAnon);

        async function cargarEventos() {
            const lista = document.getElementById('eventos-list');
            try {
                const { data, error } = await sb.from('carrusel_eventos').select('*').order('creado_en', { ascending: false });
                if (error) throw error;

                if (data.length === 0) {
                    lista.innerHTML = '<p style="color: #888; font-style: italic;">No hay eventos publicados en el carrusel.</p>';
                    return;
                }

                lista.innerHTML = data.map(ev => `
                    <div class="slide-item">
                        <img src="${ev.imagen_url}" alt="Preview" class="slide-img" onerror="this.src='https://via.placeholder.com/150x80?text=SIN+IMAGEN'">
                        <div class="slide-info">
                            <span class="slide-badge">${ev.badge}</span>
                            <div class="slide-title">${ev.titulo}</div>
                            <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">${ev.descripcion.substring(0, 80)}...</div>
                            ${ev.url_destino ? `<a href="${ev.url_destino}" target="_blank" style="color:#4a90e2; font-size:0.8rem; text-decoration:none;"><i class="fas fa-link"></i> Tiene link de destino</a>` : '<span style="color:#666; font-size:0.8rem;">Sin link de destino</span>'}
                        </div>
                        <button class="btn-delete" onclick="borrarEvento(${ev.id})" title="Eliminar"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Error al cargar", err);
                lista.innerHTML = '<p style="color: #e24a4a;">Error al cargar la base de datos.</p>';
            }
        }

        async function guardarEvento() {
            const badge = document.getElementById('ev-badge').value.trim();
            const titulo = document.getElementById('ev-title').value.trim();
            const desc = document.getElementById('ev-desc').value.trim();
            const img = document.getElementById('ev-img').value.trim();
            const link = document.getElementById('ev-link').value.trim();
            const btn = document.getElementById('btn-save');

            if (!badge || !titulo || !desc || !img) {
                alert("Por favor completa los campos principales (Imagen, Badge, Título y Descripción).");
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> GUARDANDO...';
            btn.disabled = true;

            try {
                const { error } = await sb.from('carrusel_eventos').insert([{
                    badge: badge, titulo: titulo, descripcion: desc, imagen_url: img, url_destino: link || null
                }]);

                if (error) throw error;

                document.getElementById('ev-badge').value = '';
                document.getElementById('ev-title').value = '';
                document.getElementById('ev-desc').value = '';
                document.getElementById('ev-img').value = '';
                document.getElementById('ev-link').value = '';
                
                cargarEventos();
            } catch (err) {
                console.error("Error al guardar", err);
                alert("Hubo un error al guardar el evento.");
            } finally {
                btn.innerHTML = '<i class="fas fa-save"></i> PUBLICAR EVENTO';
                btn.disabled = false;
            }
        }

        async function borrarEvento(id) {
            if (!confirm("¿Seguro que deseas eliminar este evento del carrusel?")) return;
            try {
                const { error } = await sb.from('carrusel_eventos').delete().eq('id', id);
                if (error) throw error;
                cargarEventos();
            } catch (err) {
                console.error("Error al borrar", err);
                alert("Hubo un error al intentar borrar.");
            }
        }

        document.addEventListener('DOMContentLoaded', cargarEventos);
    </script>
</body>
</html>
