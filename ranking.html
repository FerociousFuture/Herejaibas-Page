<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ranking y Log de Partidas | Herejaibas</title>
    <link rel="icon" type="image/png" href="jaiba.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Exo+2:wght@400;600;800&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0f1115;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Exo 2', sans-serif;
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container { max-width: 1000px; margin: auto; }

        /* Navegación y Títulos */
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .btn-nav { background: #23262f; border: 1px solid #3a3f4b; color: #fff; padding: 12px 24px; border-radius: 8px; font-family: 'Oswald', sans-serif; font-size: 1rem; letter-spacing: 1px; text-decoration: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-nav:hover { background: #3a3f4b; transform: translateY(-2px); }
        .btn-nav.primary { background: #f5a623; color: #000; border-color: #f5a623; }
        .btn-nav.primary:hover { background: #ffb845; }

        .page-title { color: #f4f4f0; font-family: 'Oswald', sans-serif; font-size: 2.5rem; letter-spacing: 2px; text-align: center; text-transform: uppercase; margin-bottom: 5px; }
        .page-subtitle { color: #f5a623; font-size: 0.9rem; letter-spacing: 2px; text-align: center; text-transform: uppercase; margin-bottom: 50px; font-weight: 800; }

        /* Podio Top 3 */
        .podio { display: flex; justify-content: center; align-items: flex-end; gap: 20px; margin-bottom: 60px; }
        .tarjeta-podio { background: #1a1c23; padding: 30px 20px; border-radius: 12px; width: 30%; text-align: center; border: 1px solid #3a3f4b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .tarjeta-podio .icon-trophy { font-size: 2rem; margin-bottom: 15px; }
        .tarjeta-podio h3 { font-family: 'Oswald', sans-serif; font-size: 1.5rem; text-transform: uppercase; margin-bottom: 10px; word-break: break-word; line-height: 1.2;}
        .tarjeta-podio p { color: #888; font-weight: 600; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
        .tarjeta-podio .pts { font-family: 'Oswald', sans-serif; font-size: 2.8rem; font-weight: 700; color: #e6e1d3; line-height: 1; margin-top: 15px; }

        .oro { border-top: 6px solid #f5a623; order: 2; transform: scale(1.15); z-index: 2; box-shadow: 0 0 25px rgba(245, 166, 35, 0.15); }
        .oro .icon-trophy { color: #f5a623; }
        .plata { border-top: 6px solid #c0c0c0; order: 1; }
        .plata .icon-trophy { color: #c0c0c0; }
        .bronce { border-top: 6px solid #cd7f32; order: 3; }
        .bronce .icon-trophy { color: #cd7f32; }

        /* Tabla General */
        .section-title { font-family: 'Oswald', sans-serif; font-size: 1.5rem; color: #fff; margin-bottom: 20px; border-bottom: 1px solid #3a3f4b; padding-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }
        
        .tabla-wrap { background: #1a1c23; border: 1px solid #3a3f4b; border-radius: 12px; overflow-x: auto; margin-bottom: 60px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .tabla-ranking { width: 100%; border-collapse: collapse; min-width: 600px; }
        .tabla-ranking th, .tabla-ranking td { padding: 16px 20px; text-align: center; border-bottom: 1px solid #2a2e38; }
        .tabla-ranking th { background: #23262f; color: #888; font-family: 'Exo 2', sans-serif; font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .tabla-ranking td { font-weight: 600; color: #e6e1d3; font-size: 1rem; }
        .tabla-ranking tr:last-child td { border-bottom: none; }
        .tabla-ranking tr:hover td { background: rgba(255,255,255,0.02); }
        
        .td-pos { font-family: 'Oswald', sans-serif; font-size: 1.2rem !important; color: #aaa !important; }
        .td-name { font-family: 'Oswald', sans-serif; font-size: 1.2rem !important; text-align: left !important; color: #fff !important; text-transform: uppercase;}
        .td-pts { font-family: 'Oswald', sans-serif; font-size: 1.3rem !important; color: #f5a623 !important; }

        /* Log de Partidas */
        .log-partidas { display: flex; flex-direction: column; gap: 15px; }
        .partida-item { background: #1a1c23; border: 1px solid #3a3f4b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .partida-item:hover { border-color: #555; transform: translateX(4px); }
        
        .partida-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #3a3f4b; padding-bottom: 12px; }
        .fecha { color: #888; font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; }
        .ganador-badge { background: #27ae60; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .empate-badge { background: #555; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

        .partida-body { display: flex; justify-content: space-between; align-items: center; }
        .player-col { flex: 1; display: flex; flex-direction: column; }
        .player-col.right { text-align: right; }
        .p-name { font-family: 'Oswald', sans-serif; font-size: 1.3rem; color: #fff; text-transform: uppercase; line-height: 1.2; word-wrap: break-word;}
        .p-army { font-size: 0.75rem; color: #aaa; font-weight: 600; letter-spacing: 1px; margin-top: 4px; }
        .p-score { font-family: 'Oswald', sans-serif; font-size: 2.2rem; font-weight: 700; line-height: 1; }
        .p-score.win { color: #f5a623; }
        .p-score.lose { color: #666; }
        
        .vs-divider { font-family: 'Oswald', sans-serif; font-size: 1rem; color: #555; font-weight: 800; padding: 0 20px; }

        @media (max-width: 768px) {
            .podio { flex-direction: column; align-items: center; }
            .tarjeta-podio { width: 100%; margin-bottom: 15px; }
            .oro { order: 1; transform: scale(1); border-top: 1px solid #3a3f4b; border-left: 6px solid #f5a623; }
            .plata { order: 2; border-top: 1px solid #3a3f4b; border-left: 6px solid #c0c0c0; }
            .bronce { order: 3; border-top: 1px solid #3a3f4b; border-left: 6px solid #cd7f32; }
            
            .partida-body { flex-direction: column; gap: 15px; }
            .player-col.right { text-align: left; }
            .vs-divider { padding: 10px 0; }
            .p-score { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header">
        <a href="index.html" class="btn-nav"><i class="fas fa-arrow-left"></i> INICIO</a>
        <a href="tracker.html" class="btn-nav primary"><i class="fas fa-gamepad"></i> NUEVA PARTIDA</a>
    </div>

    <h1 class="page-title">LEADERBOARD</h1>
    <p class="page-subtitle">Clasificación General y Registro</p>
    
    <div class="podio" id="podio-container">
        <!-- El top 3 se inyectará aquí -->
    </div>

    <h2 class="section-title"><i class="fas fa-list-ol"></i> CLASIFICACIÓN GENERAL</h2>
    <div class="tabla-wrap">
        <table class="tabla-ranking">
            <thead>
                <tr>
                    <th>Pos</th>
                    <th style="text-align: left;">Jugador</th>
                    <th>Partidas</th>
                    <th>Victorias</th>
                    <th>Empates</th>
                    <th>Puntos Totales</th>
                </tr>
            </thead>
            <tbody id="ranking-body">
                <!-- Del 4to en adelante -->
            </tbody>
        </table>
    </div>

    <h2 class="section-title"><i class="fas fa-history"></i> HISTORIAL DE PARTIDAS</h2>
    <div class="log-partidas" id="log-container">
        <!-- Las partidas se inyectarán aquí -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
    const sb = supabase.createClient(window._sbUrl, window._sbAnon);

    async function cargarDatos() {
        try {
            // 1. Cargar Ranking (Vista en Supabase)
            const { data: ranking, error: errRank } = await sb
                .from('ranking_jugadores')
                .select('*')
                .order('victorias', { ascending: false })
                .order('puntos_totales', { ascending: false });

            if (errRank) throw errRank;

            const podioContainer = document.getElementById('podio-container');
            const rankingBody = document.getElementById('ranking-body');

            // Renderizar Top 3
            const podioClases = [
                { class: 'oro', icon: 'fa-trophy' }, 
                { class: 'plata', icon: 'fa-medal' }, 
                { class: 'bronce', icon: 'fa-award' }
            ];

            ranking.slice(0, 3).forEach((jugador, index) => {
                podioContainer.innerHTML += `
                    <div class="tarjeta-podio ${podioClases[index].class}">
                        <i class="fas ${podioClases[index].icon} icon-trophy"></i>
                        <h3>${jugador.nombre}</h3>
                        <p>${jugador.victorias} Victorias | ${jugador.empates} Empates</p>
                        <div class="pts">${jugador.puntos_totales || 0}</div>
                        <p style="margin-top:5px; font-size:0.7rem;">PUNTOS</p>
                    </div>
                `;
            });

            // Renderizar Resto de la Tabla
            ranking.slice(3).forEach((jugador, index) => {
                rankingBody.innerHTML += `
                    <tr>
                        <td class="td-pos">#${index + 4}</td>
                        <td class="td-name">${jugador.nombre}</td>
                        <td>${jugador.partidas_jugadas}</td>
                        <td>${jugador.victorias}</td>
                        <td>${jugador.empates}</td>
                        <td class="td-pts">${jugador.puntos_totales || 0}</td>
                    </tr>
                `;
            });

            // 2. Cargar Historial (Tabla partidas conectada con jugadores)
            const { data: partidas, error: errPartidas } = await sb
                .from('partidas')
                .select(`
                    id, fecha, puntuacion_j1, puntuacion_j2, ejercito1, ejercito2, ganador_id,
                    j1:jugador1_id(id, nombre),
                    j2:jugador2_id(id, nombre),
                    ganador:ganador_id(id, nombre)
                `)
                .order('fecha', { ascending: false })
                .limit(20);

            if (errPartidas) throw errPartidas;

            const logContainer = document.getElementById('log-container');

            partidas.forEach(p => {
                const isEmpate = p.ganador_id === null;
                const badge = isEmpate 
                    ? `<span class="empate-badge">EMPATE</span>` 
                    : `<span class="ganador-badge">VICTORIA DE ${p.ganador.nombre}</span>`;

                const p1WinClass = (!isEmpate && p.ganador_id === p.j1.id) ? 'win' : 'lose';
                const p2WinClass = (!isEmpate && p.ganador_id === p.j2.id) ? 'win' : 'lose';

                const fechaStr = new Date(p.fecha).toLocaleDateString('es-ES', { 
                    year: 'numeric', month: 'short', day: 'numeric' 
                }).toUpperCase();

                logContainer.innerHTML += `
                    <div class="partida-item">
                        <div class="partida-header">
                            <span class="fecha">${fechaStr}</span>
                            ${badge}
                        </div>
                        <div class="partida-body">
                            <div class="player-col">
                                <span class="p-name">${p.j1.nombre}</span>
                                <span class="p-army">${p.ejercito1 || 'Sin facción'}</span>
                                <span class="p-score ${p1WinClass}">${p.puntuacion_j1}</span>
                            </div>
                            <div class="vs-divider">VS</div>
                            <div class="player-col right">
                                <span class="p-name">${p.j2.nombre}</span>
                                <span class="p-army">${p.ejercito2 || 'Sin facción'}</span>
                                <span class="p-score ${p2WinClass}">${p.puntuacion_j2}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

        } catch (error) {
            console.error('Error cargando los datos:', error);
            document.getElementById('podio-container').innerHTML = `<p style="color:#e24a4a;">Error al cargar la base de datos.</p>`;
        }
    }

    document.addEventListener('DOMContentLoaded', cargarDatos);
</script>

</body>
</html>
