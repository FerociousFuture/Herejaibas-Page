<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking y Log de Partidas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Podio Top 3 */
        .podio { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; text-align: center; }
        .tarjeta-podio { background: #1e1e1e; padding: 20px; border-radius: 10px; width: 30%; border-top: 5px solid transparent; }
        .oro { border-color: #ffd700; order: 2; transform: scale(1.1); }
        .plata { border-color: #c0c0c0; order: 1; }
        .bronce { border-color: #cd7f32; order: 3; }
        
        /* Tabla General */
        .tabla-ranking { width: 100%; border-collapse: collapse; margin-bottom: 40px; background: #1e1e1e; }
        .tabla-ranking th, .tabla-ranking td { padding: 12px; border-bottom: 1px solid #333; text-align: center; }
        .tabla-ranking th { background: #2a2a2a; }

        /* Log de Partidas */
        .log-partidas { background: #1e1e1e; padding: 20px; border-radius: 10px; }
        .partida-item { border-bottom: 1px solid #333; padding: 10px 0; }
        .partida-item:last-child { border-bottom: none; }
        .fecha { color: #888; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center;">Ranking de Jugadores</h1>
    
    <div class="podio" id="podio-container">
        <!-- El top 3 se inyectará aquí -->
    </div>

    <h2>Clasificación General</h2>
    <table class="tabla-ranking">
        <thead>
            <tr>
                <th>Posición</th>
                <th>Jugador</th>
                <th>Partidas Jugadas</th>
                <th>Victorias</th>
                <th>Puntos Totales</th>
            </tr>
        </thead>
        <tbody id="ranking-body">
            <!-- Del 4to en adelante -->
        </tbody>
    </table>

    <h2>Historial de Partidas</h2>
    <div class="log-partidas" id="log-container">
        <!-- Las partidas se inyectarán aquí -->
    </div>
</div>

<script>
    // 1. Cargar el Ranking
    async function cargarRanking() {
        // Reemplaza con tu ruta real de API, ej: fetch('/api/ranking')
        const response = await fetch('/api/ranking'); 
        const ranking = await response.json();

        const podioContainer = document.getElementById('podio-container');
        const rankingBody = document.getElementById('ranking-body');

        // Renderizar Top 3
        const clasesPodio = ['oro', 'plata', 'bronce'];
        ranking.slice(0, 3).forEach((jugador, index) => {
            podioContainer.innerHTML += `
                <div class="tarjeta-podio ${clasesPodio[index]}">
                    <h3>#${index + 1} ${jugador.nombre}</h3>
                    <p>${jugador.victorias} Victorias</p>
                    <p>${jugador.puntos_totales} Puntos</p>
                </div>
            `;
        });

        // Renderizar del 4to al último
        ranking.slice(3).forEach((jugador, index) => {
            rankingBody.innerHTML += `
                <tr>
                    <td>#${index + 4}</td>
                    <td>${jugador.nombre}</td>
                    <td>${jugador.partidas_jugadas}</td>
                    <td>${jugador.victorias}</td>
                    <td>${jugador.puntos_totales}</td>
                </tr>
            `;
        });
    }

    // 2. Cargar el Historial de Partidas
    async function cargarHistorial() {
        // Reemplaza con tu ruta real de API, ej: fetch('/api/partidas')
        const response = await fetch('/api/partidas');
        const partidas = await response.json();
        
        const logContainer = document.getElementById('log-container');

        partidas.forEach(partida => {
            const fecha = new Date(partida.fecha).toLocaleDateString();
            logContainer.innerHTML += `
                <div class="partida-item">
                    <span class="fecha">[${fecha}]</span> 
                    <strong>${partida.jugador1}</strong> (${partida.puntuacion_j1} pts) 
                    vs 
                    <strong>${partida.jugador2}</strong> (${partida.puntuacion_j2} pts) 
                    <br> > Ganador: <span>${partida.ganador || 'Empate'}</span>
                </div>
            `;
        });
    }

    // Inicializar
    // Descomenta estas líneas cuando conectes tu backend
    // cargarRanking();
    // cargarHistorial();
</script>

</body>
</html>
