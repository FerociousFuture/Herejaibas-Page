<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registrar Jugador | Herejaibas</title>
    <link rel="icon" type="image/png" href="jaiba.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0f1115;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Exo 2', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #1a1c23;
            border: 1px solid #3a3f4b;
            padding: 40px 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .title {
            font-family: 'Oswald', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #f4f4f0;
            letter-spacing: 2px;
        }
        
        .subtitle {
            color: #f5a623;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .tk-input {
            width: 100%;
            background: #23262f;
            border: 1px solid #3a3f4b;
            border-radius: 8px;
            padding: 16px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            outline: none;
            font-family: 'Exo 2', sans-serif;
            transition: all 0.2s;
            text-align: center;
            margin-bottom: 25px;
        }

        .tk-input::placeholder { color: #666; font-weight: 600; }
        .tk-input:focus { border-color: #f5a623; box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.2); }

        .btn-submit {
            width: 100%;
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Exo 2', sans-serif;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover { background: #2ecc71; transform: translateY(-2px); }
        .btn-submit:disabled { background: #555; color: #aaa; cursor: not-allowed; transform: none; }
        
        .note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 class="title"><i class="fas fa-user-plus"></i> NUEVO JUGADOR</h2>
        <p class="subtitle">Regístrate en la Base de Datos</p>
        
        <input type="text" id="nombre-input" class="tk-input" placeholder="Nombre o Nickname..." autocomplete="off" onkeypress="handleEnter(event)">
        
        <button id="btn-guardar" class="btn-submit" onclick="guardarJugador()">
            <i class="fas fa-save"></i> GUARDAR JUGADOR
        </button>
        
        <p class="note">Una vez guardado, cierra esta pestaña y presiona <strong>"Refrescar Lista"</strong> en el Tracker para poder seleccionarlo.</p>
    </div>

    <!-- Scripts de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <script>
        // Función para limpiar XSS (Escapa caracteres peligrosos)
        function sanitizeHTML(str) {
            const tempDiv = document.createElement('div');
            tempDiv.textContent = str;
            return tempDiv.innerHTML;
        }

        // Permite guardar presionando la tecla "Enter"
        function handleEnter(e) {
            if (e.key === 'Enter') {
                guardarJugador();
            }
        }

        async function guardarJugador() {
            const nombreInput = document.getElementById('nombre-input');
            let nombreLimpio = sanitizeHTML(nombreInput.value.trim());
            const btn = document.getElementById('btn-guardar');

            if(!nombreLimpio) { 
                alert("Por favor ingresa un nombre válido."); 
                nombreInput.focus();
                return; 
            }

            // Cambiar estado del botón a cargando
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> GUARDANDO...';
            btn.disabled = true;

            try {
                // Inicializar Supabase
                const sb = supabase.createClient(window._sbUrl, window._sbAnon);
                
                // Insertar el nuevo jugador ya sanitizado
                const { error } = await sb
                    .from('jugadores')
                    .insert([{ nombre: nombreLimpio }]);
                
                if (error) throw error;

                // Alerta de éxito y cerrar ventana
                alert("¡Jugador registrado con éxito!\nYa puedes cerrar esta ventana y refrescar la lista en el Tracker.");
                
                nombreInput.value = '';
                btn.innerHTML = '<i class="fas fa-check"></i> GUARDADO';
                
                window.close(); 
                
            } catch(e) {
                console.error("Error al guardar:", e);
                alert("Hubo un error al guardar el jugador. Intenta nuevamente.");
                btn.innerHTML = '<i class="fas fa-save"></i> GUARDAR JUGADOR';
                btn.disabled = false;
            }
        }
        
        window.onload = function() {
            document.getElementById('nombre-input').focus();
        };
    </script>
</body>
</html>
