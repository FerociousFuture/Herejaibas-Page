        async function subirDatos() {
            const btn = document.getElementById('btn-subir');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = "Preparando datos...";

            let datosParaSubir = [];

            // 2. Extraer datos y prepararlos para Supabase
            for (const [faccion, destacamentos] of Object.entries(tkDetachments)) {
                for (const dest of destacamentos) {
                    datosParaSubir.push({
                        faccion: faccion,
                        nombre: dest.name,
                        disposicion: dest.force,
                        puntos: dest.dp
                    });
                }
            }

            status.textContent = `Subiendo ${datosParaSubir.length} destacamentos...`;

            try {
                // 3. Ejecutar la inserción masiva a la tabla 'destacamentos'
                const { error } = await supabase.from('destacamentos').insert(datosParaSubir);
                
                if (error) throw error;
                
                status.style.color = "#27ae60";
                status.textContent = "¡Datos subidos con éxito! Ya puedes borrar este archivo.";
            } catch (err) {
                console.error(err);
                status.style.color = "#e24a4a";
                status.textContent = "Error al subir los datos. Revisa la consola.";
                btn.disabled = false;
            }
        }
